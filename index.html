<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1a" />
    <script>
      // Apply the colour palette before first paint. See src/lib/palette.ts.
      try {
        var p = new URLSearchParams(location.search).get('palette')
        if (p === 'default') localStorage.removeItem('cw:palette')
        else if (p) localStorage.setItem('cw:palette', p)
        p = localStorage.getItem('cw:palette')
        if (p) document.documentElement.dataset.palette = p
      } catch (e) {}
    </script>
    <meta name="description" content="Shuffle a virtual deck, flip a card, do the reps. A no-equipment-needed workout you can run anywhere." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Burno · Flip. Burn. Repeat." />
    <meta property="og:description" content="Shuffle a virtual deck, flip a card, do the reps. A full-body workout you can do anywhere, solo or with friends." />
    <meta name="twitter:card" content="summary" />
    <title>Burno · 52-card workout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
