<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3ea" />
    <script>
      // Light/dark before first paint: light unless someone has switched to dark. See src/lib/theme.ts.
      try {
        var t = localStorage.getItem('burno:theme')
        if (t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#170e0b')
      } catch (e) {}
    </script>
    <meta name="description" content="Shuffle a virtual deck, flip a card, do the reps. A no-equipment-needed workout you can run anywhere." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icon-512.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- Link previews (WhatsApp, iMessage, Slack…). Crawlers need an absolute PNG/JPG URL; SVG is ignored. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Burno" />
    <meta property="og:url" content="https://burno.app/" />
    <meta property="og:title" content="Burno · Flip. Burn. Repeat." />
    <meta property="og:description" content="Shuffle a virtual deck, flip a card, do the reps. A full-body workout you can do anywhere, solo or with friends." />
    <meta property="og:image" content="https://burno.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Burno logo: a playing card with a flame, and the words Flip. Burn. Repeat." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://burno.app/og-image.png" />
    <title>Burno · 52-card workout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
