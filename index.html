<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3ea" />
    <script>
      // Light/dark before first paint: a saved choice wins, else the system setting. See src/lib/theme.ts.
      try {
        var t = localStorage.getItem('burno:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#170e0b')
      } catch (e) {}
    </script>
    <meta name="description" content="Shuffle a virtual deck, flip a card, do the reps. A no-equipment-needed workout you can run anywhere." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Burno · Flip. Burn. Repeat." />
    <meta property="og:description" content="Shuffle a virtual deck, flip a card, do the reps. A full-body workout you can do anywhere, solo or with friends." />
    <meta name="twitter:card" content="summary" />
    <title>Burno · 52-card workout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
